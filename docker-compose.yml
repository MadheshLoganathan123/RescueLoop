version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rescueloop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rescueloop
      POSTGRES_USER: rescueloop_user
      POSTGRES_PASSWORD: rescueloop_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescueloop_user -d rescueloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rescueloop_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://rescueloop_user:rescueloop_password@db:5432/rescueloop
      - JWT_SECRET=rescueloop_super_secure_jwt_secret_key_production_2026_0123456789
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rescueloop_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
